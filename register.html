<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register – Budget Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#2c3e50;height:100vh;display:flex;flex-direction:column}
.top-bar{background:#fff;padding:14px 40px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.logo{font-size:18px;font-weight:700;color:rgb(60,158,153);text-decoration:none}
.back-link{font-size:14px;color:rgb(60,158,153);text-decoration:none;font-weight:600}
.back-link:hover{text-decoration:underline}
.main{display:flex;flex:1}
.left-container{width:50%;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#f0f4f8,#d9e2ec);padding:40px}
.register-container{background:#fff;padding:44px 40px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.12);text-align:center;width:340px}
h2{margin-bottom:8px;color:rgb(60,158,153);font-size:26px}
.subtitle{font-size:14px;color:#888;margin-bottom:28px}
input[type=text],input[type=password],input[type=email]{width:100%;padding:12px 14px;margin-bottom:16px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;transition:border-color .2s;outline:none}
input:focus{border-color:rgb(60,158,153)}
.btn-submit{width:100%;padding:13px;background:rgb(60,158,153);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:background .3s,transform .2s;margin-top:4px}
.btn-submit:hover{background:rgb(45,130,126);transform:translateY(-1px)}
.login-link{margin-top:18px;font-size:14px;color:#666}
.login-link a{color:rgb(60,158,153);font-weight:600;text-decoration:none}
.login-link a:hover{text-decoration:underline}
.msg{padding:10px;border-radius:8px;margin-bottom:14px;font-size:14px;font-weight:600;display:none}
.msg.success{background:#d4edda;color:#155724;display:block}
.msg.error{background:#f8d7da;color:#721c24;display:block}
.right-container{width:50%;background:#eaf1f8;display:flex;justify-content:center;align-items:center;padding:40px}
.right-container img{width:85%;max-width:480px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.right-info{text-align:center}
.right-info h3{font-size:22px;color:#1a1a2e;margin-bottom:12px}
.right-info p{color:#666;font-size:15px;line-height:1.6;max-width:340px}
@media(max-width:768px){.main{flex-direction:column}.left-container,.right-container{width:100%}.right-container{display:none}}
</style>
</head>
<body>
<div class="top-bar">
  <a href="index.html" class="logo">💰 BudgetTracker</a>
  <a href="index.html" class="back-link">← Back to Home</a>
</div>
<div class="main">
  <div class="left-container">
    <div class="register-container">
      <h2>Create Account</h2>
      <p class="subtitle">Start tracking your finances today</p>
      <div class="msg" id="msg"></div>
      <form id="registerForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password (min 6 chars)" required minlength="6">
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        <button type="submit" class="btn-submit">Register</button>
      </form>
      <div class="login-link">Already have an account? <a href="login.html">Login here</a></div>
    </div>
  </div>
  <div class="right-container">
    <div class="right-info">
      <img src="register.png" alt="Register" onerror="this.style.display='none'">
      <h3>Your finances, your control</h3>
      <p>Join thousands of users who manage their budget smarter with our easy-to-use tracker.</p>
    </div>
  </div>
</div>
<script>
document.getElementById('registerForm').addEventListener('submit',function(e){
  e.preventDefault();
  var u=document.getElementById('username').value.trim();
  var em=document.getElementById('email').value.trim();
  var p=document.getElementById('password').value;
  var cp=document.getElementById('confirmPassword').value;
  var msg=document.getElementById('msg');
  msg.className='msg';
  if(p!==cp){msg.textContent='Passwords do not match!';msg.className='msg error';return;}
  var users=JSON.parse(localStorage.getItem('bt_users')||'{}');
  if(users[u]){msg.textContent='Username already exists. Try another.';msg.className='msg error';return;}
  users[u]={password:p,email:em,transactions:[],budget:0};
  localStorage.setItem('bt_users',JSON.stringify(users));
  msg.textContent='✅ Account created! Redirecting to login...';
  msg.className='msg success';
  setTimeout(function(){window.location.href='login.html';},1500);
});
</script>
</body>
</html>
