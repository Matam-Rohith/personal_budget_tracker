<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – Personal Budget Tracker</title>
  <meta name="description" content="Register an account for Personal Budget Tracker using Supabase.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .top-bar {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #0f172a;
      font-weight: 700;
      font-size: 16px;
    }
    .brand-mark {
      width: 26px;
      height: 26px;
      background: #0f766e;
      color: #ffffff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }
    .back-link {
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .back-link:hover { color: #0f172a; }

    .main-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 36px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
    }
    .auth-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }
    .form-input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }
    .btn-submit {
      width: 100%;
      padding: 11px;
      background: #0f766e;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-top: 8px;
    }
    .btn-submit:hover { background: #115e59; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-msg {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .status-msg.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      display: block;
    }
    .status-msg.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
      display: block;
    }

    .auth-footer {
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
    .auth-footer a {
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }

    .db-status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #0f766e;
      background: #f0fdfa;
      border: 1px solid #ccfbf1;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <a href="index.html" class="brand">
      <div class="brand-mark">₹</div>
      <span>BudgetTracker</span>
    </a>
    <a href="login.html" class="back-link">Existing User? Sign In</a>
  </header>

  <main class="main-wrapper">
    <div class="auth-card">
      <div class="db-status-badge">
        <span style="width:7px;height:7px;border-radius:50%;background:#0f766e;display:inline-block;"></span>
        <span>Supabase PostgreSQL Integration</span>
      </div>

      <h1 class="auth-title">Create your account</h1>
      <p class="auth-sub">Set up your profile to start tracking transactions in Supabase.</p>

      <div id="statusMsg" class="status-msg"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" id="fullName" class="form-input" required autocomplete="name" placeholder="e.g. Rohith M.">
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" required autocomplete="email" placeholder="name@example.com">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-input" required minlength="6" autocomplete="new-password" placeholder="Min. 6 chars">
          </div>
          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-input" required minlength="6" autocomplete="new-password" placeholder="Repeat password">
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Register Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { getSupabaseConfig } from './supabaseClient.js';

    let supabase = null;

    function getClient() {
      if (!supabase && window.supabase) {
        const { url, anonKey } = getSupabaseConfig();
        supabase = window.supabase.createClient(url, anonKey, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storage: window.localStorage
          }
        });
      }
      return supabase;
    }

    getClient();

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const statusEl = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submitBtn');

      statusEl.className = 'status-msg';
      statusEl.textContent = '';

      if (password !== confirmPassword) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'Passwords do not match. Please verify and re-enter.';
        return;
      }

      if (password.length < 6) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = 'Password must be at least 6 characters.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Supabase account...';

      try {
        const client = getClient();
        if (!client) throw new Error('Could not connect to Supabase client.');

        // 1. Register with Supabase Auth
        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullName
            }
          }
        });

        if (error) {
          // 9. Handle duplicate registration / email errors
          if (error.message.includes('User already registered') || error.message.includes('already exists')) {
            throw new Error('An account with this email address already exists. Please Sign In.');
          }
          throw error;
        }

        const user = data.user;
        if (!user) {
          throw new Error('Registration did not return user details.');
        }

        // 2. Create corresponding profile in profiles table
        try {
          await client.from('profiles').upsert({
            id: user.id,
            full_name: fullName,
            created_at: new Date().toISOString()
          }, { onConflict: 'id' });
        } catch (profileErr) {
          console.warn('Profile sync note:', profileErr.message);
        }

        // 3. Check if session was immediately established
        if (data.session) {
          statusEl.className = 'status-msg success';
          statusEl.textContent = 'Registration successful! Opening dashboard...';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 500);
        } else {
          // If email confirmation is required in project settings
          statusEl.className = 'status-msg success';
          statusEl.textContent = 'Account created! Redirecting to login...';
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1200);
        }
      } catch (err) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = err.message || 'Registration failed. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register Account';
      }
    });
  </script>
</body>
</html>
