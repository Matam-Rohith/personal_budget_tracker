<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – Personal Budget Tracker</title>
  <meta name="description" content="Sign in to your personal budget tracker dashboard.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .top-bar {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #0f172a;
      font-weight: 700;
      font-size: 16px;
    }
    .brand-mark {
      width: 26px;
      height: 26px;
      background: #0f766e;
      color: #ffffff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }
    .back-link {
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .back-link:hover { color: #0f172a; }

    .main-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
    }
    .auth-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }
    .form-input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }
    .btn-submit {
      width: 100%;
      padding: 10px;
      background: #0f766e;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-top: 8px;
    }
    .btn-submit:hover { background: #115e59; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .demo-callout {
      margin-top: 20px;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 13px;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-demo {
      padding: 4px 10px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #0f766e;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-demo:hover {
      background: #f1f5f9;
      border-color: #94a3b8;
    }

    .status-msg {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .status-msg.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      display: block;
    }
    .status-msg.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
      display: block;
    }

    .auth-footer {
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
    .auth-footer a {
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="top-bar">
    <a href="index.html" class="brand">
      <div class="brand-mark">₹</div>
      <span>BudgetTracker</span>
    </a>
    <a href="index.html" class="back-link">Return to Home</a>
  </header>

  <main class="main-wrapper">
    <div class="auth-card">
      <h1 class="auth-title">Sign in to your account</h1>
      <p class="auth-sub">Enter your credentials to access your personal ledger.</p>

      <div id="statusMsg" class="status-msg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username" class="form-label">Username</label>
          <input type="text" id="username" class="form-input" required autocomplete="username" placeholder="demo">
        </div>
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
      </form>

      <div class="demo-callout">
        <div>
          <span style="font-weight:600;color:#0f172a;">Sample Account</span><br>
          <span style="font-size:12px;color:#64748b;">demo / demo123</span>
        </div>
        <button type="button" class="btn-demo" onclick="fillDemo()">Fill Credentials</button>
      </div>

      <div class="auth-footer">
        Do not have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </main>

  <script>
    function fillDemo() {
      document.getElementById('username').value = 'demo';
      document.getElementById('password').value = 'demo123';
      document.getElementById('statusMsg').className = 'status-msg';
      document.getElementById('statusMsg').textContent = '';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const statusEl = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submitBtn');

      statusEl.className = 'status-msg';
      statusEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const result = await response.json();

        if (response.ok && result.ok) {
          sessionStorage.setItem('bt_auth_token', result.token);
          sessionStorage.setItem('bt_current_user', result.user.username);
          sessionStorage.setItem('bt_user_data', JSON.stringify(result.user));

          statusEl.className = 'status-msg success';
          statusEl.textContent = 'Sign-in verified. Opening dashboard...';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 400);
          return;
        } else {
          throw new Error(result.error || 'Invalid credentials');
        }
      } catch (err) {
        // Client-side fallback check
        const users = JSON.parse(localStorage.getItem('bt_users') || '{}');
        if (users[u] && users[u].password === p) {
          sessionStorage.setItem('bt_current_user', u);
          statusEl.className = 'status-msg success';
          statusEl.textContent = 'Authenticated locally. Opening dashboard...';
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 400);
          return;
        }

        statusEl.className = 'status-msg error';
        statusEl.textContent = err.message || 'Unable to sign in. Please verify your credentials.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
