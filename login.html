<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – Personal Budget Tracker</title>
  <meta name="description" content="Sign in to your personal budget tracker dashboard with Supabase.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .top-bar {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #0f172a;
      font-weight: 700;
      font-size: 16px;
    }
    .brand-mark {
      width: 26px;
      height: 26px;
      background: #0f766e;
      color: #ffffff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }
    .back-link {
      font-size: 13px;
      font-weight: 500;
      color: #64748b;
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .back-link:hover { color: #0f172a; }

    .main-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 36px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05);
    }
    .auth-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      color: #0f172a;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }
    .form-input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }
    .btn-submit {
      width: 100%;
      padding: 11px;
      background: #0f766e;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-top: 8px;
    }
    .btn-submit:hover { background: #115e59; }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-msg {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      display: none;
    }
    .status-msg.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      display: block;
    }
    .status-msg.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
      display: block;
    }

    .auth-footer {
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
      text-align: center;
    }
    .auth-footer a {
      color: #0f766e;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }

    .db-status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #0f766e;
      background: #f0fdfa;
      border: 1px solid #ccfbf1;
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <a href="index.html" class="brand">
      <div class="brand-mark">₹</div>
      <span>BudgetTracker</span>
    </a>
    <a href="index.html" class="back-link">Return to Home</a>
  </header>

  <main class="main-wrapper">
    <div class="auth-card">
      <div class="db-status-badge">
        <span style="width:7px;height:7px;border-radius:50%;background:#0f766e;display:inline-block;"></span>
        <span>Connected to Supabase Authentication</span>
      </div>

      <h1 class="auth-title">Sign in to your account</h1>
      <p class="auth-sub">Enter your email and password to access your personal ledger.</p>

      <div id="statusMsg" class="status-msg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
      </form>

      <div class="auth-footer">
        Do not have an account? <a href="register.html">Register with Supabase</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { getSupabaseConfig, signInUser } from './supabaseClient.js';

    let supabase = null;

    async function init() {
      const { url, anonKey } = getSupabaseConfig();
      if (window.supabase) {
        supabase = window.supabase.createClient(url, anonKey, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
            storage: window.localStorage
          }
        });

        // 10. Automatically restore the user's session when the application is reopened
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          window.location.href = 'dashboard.html';
          return;
        }
      }
    }

    init();

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const statusEl = document.getElementById('statusMsg');
      const submitBtn = document.getElementById('submitBtn');

      statusEl.className = 'status-msg';
      statusEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying with Supabase...';

      try {
        if (!supabase) {
          const { url, anonKey } = getSupabaseConfig();
          supabase = window.supabase.createClient(url, anonKey);
        }

        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          // 8. Handle incorrect email/password errors
          if (error.message.includes('Invalid login credentials')) {
            throw new Error('Incorrect email or password. Please verify your credentials.');
          }
          if (error.message.includes('Email not confirmed')) {
            throw new Error('Please verify your email address or disable email confirmation in your Supabase Auth settings.');
          }
          throw error;
        }

        if (data.session) {
          statusEl.className = 'status-msg success';
          statusEl.textContent = 'Authentication successful! Restoring session...';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 350);
        }
      } catch (err) {
        statusEl.className = 'status-msg error';
        statusEl.textContent = err.message || 'Unable to sign in. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
