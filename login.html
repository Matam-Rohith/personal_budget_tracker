<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Budget Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#2c3e50;height:100vh;display:flex;flex-direction:column}
.top-bar{background:#fff;padding:14px 40px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.logo{font-size:18px;font-weight:700;color:rgb(60,158,153);text-decoration:none}
.back-link{font-size:14px;color:rgb(60,158,153);text-decoration:none;font-weight:600}
.back-link:hover{text-decoration:underline}
.main{display:flex;flex:1}
.left-container{width:50%;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#f0f4f8,#d9e2ec);padding:40px}
.login-container{background:#fff;padding:44px 40px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.12);text-align:center;width:340px}
h2{margin-bottom:8px;color:rgb(60,158,153);font-size:26px}
.subtitle{font-size:14px;color:#888;margin-bottom:28px}
input[type=text],input[type=password]{width:100%;padding:12px 14px;margin-bottom:16px;border:1.5px solid #ddd;border-radius:8px;font-size:15px;transition:border-color .2s;outline:none}
input:focus{border-color:rgb(60,158,153)}
.btn-submit{width:100%;padding:13px;background:rgb(60,158,153);color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:700;cursor:pointer;transition:background .3s,transform .2s;margin-top:4px}
.btn-submit:hover{background:rgb(45,130,126);transform:translateY(-1px)}
.register-link{margin-top:18px;font-size:14px;color:#666}
.register-link a{color:rgb(60,158,153);font-weight:600;text-decoration:none}
.register-link a:hover{text-decoration:underline}
.demo-box{margin-top:16px;padding:12px;background:#f0faf9;border:1px dashed rgb(60,158,153);border-radius:8px;font-size:13px;color:#555}
.demo-box b{color:rgb(60,158,153)}
.msg{padding:10px;border-radius:8px;margin-bottom:14px;font-size:14px;font-weight:600;display:none}
.msg.success{background:#d4edda;color:#155724;display:block}
.msg.error{background:#f8d7da;color:#721c24;display:block}
.right-container{width:50%;background:#eaf1f8;display:flex;justify-content:center;align-items:center;padding:40px}
.right-container img{width:100%;max-width:500px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
@media(max-width:768px){.main{flex-direction:column}.left-container,.right-container{width:100%}.right-container{display:none}}
</style>
</head>
<body>
<div class="top-bar">
  <a href="index.html" class="logo">💰 BudgetTracker</a>
  <a href="index.html" class="back-link">← Back to Home</a>
</div>
<div class="main">
  <div class="left-container">
    <div class="login-container">
      <h2>Welcome Back</h2>
      <p class="subtitle">Login to your budget dashboard</p>
      <div class="msg" id="msg"></div>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="btn-submit">Login</button>
      </form>
      <div class="register-link">Don't have an account? <a href="register.html">Register here</a></div>
      <div class="demo-box">🎯 <b>Demo:</b> Use username <b>demo</b> / password <b>demo123</b> to explore</div>
    </div>
  </div>
  <div class="right-container">
    <img src="login.png" alt="Login" onerror="this.style.display='none'">
  </div>
</div>
<script>
// Seed demo account
(function(){
  var users=JSON.parse(localStorage.getItem('bt_users')||'{}');
  if(!users['demo']){
    users['demo']={password:'demo123',email:'demo@example.com',budget:5000,transactions:[
      {id:1,type:'income',category:'Salary',amount:30000,note:'Monthly salary',date:'2026-05-01'},
      {id:2,type:'expense',category:'Food',amount:3200,note:'Groceries',date:'2026-05-05'},
      {id:3,type:'expense',category:'Transport',amount:1500,note:'Auto & fuel',date:'2026-05-08'},
      {id:4,type:'expense',category:'Utilities',amount:2200,note:'Electricity bill',date:'2026-05-10'},
      {id:5,type:'income',category:'Freelance',amount:8000,note:'Web project payment',date:'2026-05-12'},
      {id:6,type:'expense',category:'Shopping',amount:4500,note:'New shoes',date:'2026-05-15'},
      {id:7,type:'expense',category:'Food',amount:1800,note:'Restaurants',date:'2026-05-18'},
      {id:8,type:'expense',category:'Entertainment',amount:1200,note:'Movies & OTT',date:'2026-05-20'}
    ]};
    localStorage.setItem('bt_users',JSON.stringify(users));
  }
})();
document.getElementById('loginForm').addEventListener('submit',function(e){
  e.preventDefault();
  var u=document.getElementById('username').value.trim();
  var p=document.getElementById('password').value;
  var msg=document.getElementById('msg');
  var users=JSON.parse(localStorage.getItem('bt_users')||'{}');
  if(users[u]&&users[u].password===p){
    sessionStorage.setItem('bt_current_user',u);
    msg.textContent='✅ Login successful! Loading dashboard...';
    msg.className='msg success';
    setTimeout(function(){window.location.href='dashboard.html';},1000);
  } else {
    msg.textContent='❌ Invalid username or password.';
    msg.className='msg error';
  }
});
</script>
</body>
</html>
