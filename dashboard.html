<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard – Budget Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f0f4f8;color:#333;min-height:100vh}
.navbar{background:#fff;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.08);position:sticky;top:0;z-index:100}
.logo{font-size:18px;font-weight:700;color:rgb(60,158,153)}
.nav-right{display:flex;align-items:center;gap:16px}
.user-badge{background:rgba(60,158,153,.1);color:rgb(60,158,153);padding:6px 14px;border-radius:20px;font-weight:600;font-size:14px}
.logout-btn{background:none;border:1.5px solid #ddd;padding:7px 16px;border-radius:8px;cursor:pointer;font-size:14px;color:#555;font-weight:600;transition:all .2s}
.logout-btn:hover{border-color:#e74c3c;color:#e74c3c}
.page{max-width:1200px;margin:0 auto;padding:28px 24px}
.greeting{margin-bottom:24px}
.greeting h1{font-size:24px;color:#1a1a2e;margin-bottom:4px}
.greeting p{color:#888;font-size:15px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:28px}
.stat-card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-left:5px solid transparent}
.stat-card.income{border-color:#27ae60}
.stat-card.expense{border-color:#e74c3c}
.stat-card.balance{border-color:rgb(60,158,153)}
.stat-card.budget{border-color:#f39c12}
.stat-label{font-size:13px;color:#888;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:700;color:#1a1a2e}
.stat-sub{font-size:12px;color:#aaa;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card h3{font-size:16px;font-weight:700;color:#1a1a2e;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.add-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.add-form select,.add-form input{padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;outline:none;transition:border-color .2s}
.add-form select:focus,.add-form input:focus{border-color:rgb(60,158,153)}
.add-form .full{grid-column:1/-1}
.btn-add{width:100%;grid-column:1/-1;padding:12px;background:rgb(60,158,153);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s}
.btn-add:hover{background:rgb(45,130,126)}
.tx-list{max-height:340px;overflow-y:auto}
.tx-item{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f0f0f0}
.tx-item:last-child{border-bottom:none}
.tx-left{display:flex;align-items:center;gap:12px}
.tx-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tx-icon.inc{background:#d4edda}
.tx-icon.exp{background:#f8d7da}
.tx-info .tx-cat{font-weight:700;font-size:14px;color:#1a1a2e}
.tx-info .tx-note{font-size:12px;color:#999;margin-top:1px}
.tx-info .tx-date{font-size:11px;color:#bbb;margin-top:2px}
.tx-amount{font-weight:700;font-size:15px}
.tx-amount.inc{color:#27ae60}
.tx-amount.exp{color:#e74c3c}
.tx-del{background:none;border:none;cursor:pointer;color:#ccc;font-size:16px;margin-left:10px;padding:4px;border-radius:4px;transition:color .2s}
.tx-del:hover{color:#e74c3c}
.empty-state{text-align:center;padding:40px 20px;color:#bbb}
.empty-state div{font-size:36px;margin-bottom:10px}
.budget-section{margin-bottom:28px}
.budget-bar-wrap{background:#eee;border-radius:20px;height:14px;overflow:hidden;margin:10px 0 6px}
.budget-bar{height:100%;border-radius:20px;background:rgb(60,158,153);transition:width .5s}
.budget-bar.warn{background:#f39c12}
.budget-bar.over{background:#e74c3c}
.budget-text{font-size:13px;color:#777;display:flex;justify-content:space-between}
.set-budget{display:flex;gap:10px;margin-top:12px}
.set-budget input{flex:1;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;outline:none}
.set-budget input:focus{border-color:rgb(60,158,153)}
.set-budget button{padding:10px 20px;background:rgb(60,158,153);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.chart-wrap{position:relative;height:260px}
.msg-toast{position:fixed;bottom:28px;right:28px;background:#1a1a2e;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.msg-toast.show{opacity:1}
@media(max-width:768px){.grid2{grid-template-columns:1fr}.add-form{grid-template-columns:1fr}.stats-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.stats-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar">
  <div class="logo">💰 BudgetTracker</div>
  <div class="nav-right">
    <span class="user-badge" id="userBadge">👤 Loading...</span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</nav>
<div class="page">
  <div class="greeting">
    <h1 id="greetMsg">Welcome back!</h1>
    <p id="dateStr"></p>
  </div>
  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card income">
      <div class="stat-label">Total Income</div>
      <div class="stat-value" id="statIncome">₹0</div>
      <div class="stat-sub">All time earnings</div>
    </div>
    <div class="stat-card expense">
      <div class="stat-label">Total Expenses</div>
      <div class="stat-value" id="statExpense">₹0</div>
      <div class="stat-sub">All time spending</div>
    </div>
    <div class="stat-card balance">
      <div class="stat-label">Net Balance</div>
      <div class="stat-value" id="statBalance">₹0</div>
      <div class="stat-sub">Income minus expenses</div>
    </div>
    <div class="stat-card budget">
      <div class="stat-label">Budget Status</div>
      <div class="stat-value" id="statBudgetPct">—</div>
      <div class="stat-sub">Monthly budget used</div>
    </div>
  </div>
  <!-- Budget Bar -->
  <div class="card budget-section">
    <h3>📊 Monthly Budget Tracker</h3>
    <div class="budget-bar-wrap"><div class="budget-bar" id="budgetBar" style="width:0%"></div></div>
    <div class="budget-text"><span id="budgetSpent">₹0 spent</span><span id="budgetTotal">Budget: ₹0</span></div>
    <div class="set-budget">
      <input type="number" id="budgetInput" placeholder="Set monthly budget (₹)" min="0">
      <button onclick="saveBudget()">Set Budget</button>
    </div>
  </div>
  <!-- Main grid -->
  <div class="grid2">
    <!-- Add Transaction -->
    <div class="card">
      <h3>➕ Add Transaction</h3>
      <div class="add-form">
        <select id="txType">
          <option value="income">💚 Income</option>
          <option value="expense">❤️ Expense</option>
        </select>
        <select id="txCat">
          <option>Salary</option>
          <option>Freelance</option>
          <option>Business</option>
          <option>Food</option>
          <option>Transport</option>
          <option>Shopping</option>
          <option>Utilities</option>
          <option>Entertainment</option>
          <option>Health</option>
          <option>Education</option>
          <option>Other</option>
        </select>
        <input type="number" id="txAmount" placeholder="Amount (₹)" min="1" class="full">
        <input type="text" id="txNote" placeholder="Note (optional)" class="full">
        <input type="date" id="txDate">
        <button class="btn-add full" onclick="addTransaction()">Add Transaction</button>
      </div>
    </div>
    <!-- Chart -->
    <div class="card">
      <h3>🥧 Expense Breakdown</h3>
      <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
    </div>
  </div>
  <!-- Transactions list -->
  <div class="card">
    <h3>📋 All Transactions <span id="txCount" style="font-weight:400;color:#aaa;font-size:14px"></span></h3>
    <div class="tx-list" id="txList"></div>
  </div>
</div>
<div class="msg-toast" id="toast"></div>
<script>
var currentUser=null,userData=null,pieChart=null;
function getUsers(){return JSON.parse(localStorage.getItem('bt_users')||'{}');}
function saveUsers(u){localStorage.setItem('bt_users',JSON.stringify(u));}
function toast(msg,good){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=good?'#27ae60':'#e74c3c';
  t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}
function logout(){
  sessionStorage.removeItem('bt_current_user');
  window.location.href='login.html';
}
function fmt(n){return'₹'+Number(n).toLocaleString('en-IN');}
function init(){
  currentUser=sessionStorage.getItem('bt_current_user');
  if(!currentUser){window.location.href='login.html';return;}
  var users=getUsers();
  if(!users[currentUser]){window.location.href='login.html';return;}
  userData=users[currentUser];
  document.getElementById('userBadge').textContent='👤 '+currentUser;
  document.getElementById('greetMsg').textContent='Welcome back, '+currentUser+'! 👋';
  var d=new Date();
  document.getElementById('dateStr').textContent=d.toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('txDate').value=d.toISOString().split('T')[0];
  if(userData.budget) document.getElementById('budgetInput').value=userData.budget;
  render();
}
function render(){
  var txs=userData.transactions||[];
  var inc=0,exp=0;
  txs.forEach(function(t){if(t.type==='income')inc+=t.amount;else exp+=t.amount;});
  document.getElementById('statIncome').textContent=fmt(inc);
  document.getElementById('statExpense').textContent=fmt(exp);
  var bal=inc-exp;
  var balEl=document.getElementById('statBalance');
  balEl.textContent=fmt(bal);
  balEl.style.color=bal>=0?'#27ae60':'#e74c3c';
  var budget=userData.budget||0;
  var pct=budget>0?Math.min(100,Math.round(exp/budget*100)):0;
  document.getElementById('statBudgetPct').textContent=budget>0?pct+'% used':'Not set';
  document.getElementById('budgetSpent').textContent=fmt(exp)+' spent';
  document.getElementById('budgetTotal').textContent='Budget: '+fmt(budget);
  var bar=document.getElementById('budgetBar');
  bar.style.width=pct+'%';
  bar.className='budget-bar'+(pct>=100?' over':pct>=80?' warn':'');
  // Pie chart
  var cats={};
  txs.filter(function(t){return t.type==='expense';}).forEach(function(t){
    cats[t.category]=(cats[t.category]||0)+t.amount;
  });
  var labels=Object.keys(cats),data=Object.values(cats);
  var colors=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e91e63','#00bcd4','#8bc34a','#ff5722'];
  if(pieChart)pieChart.destroy();
  var ctx=document.getElementById('pieChart').getContext('2d');
  if(labels.length>0){
    pieChart=new Chart(ctx,{type:'doughnut',data:{labels:labels,datasets:[{data:data,backgroundColor:colors.slice(0,labels.length),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:12},padding:12}}}}});
  } else {
    ctx.clearRect(0,0,300,300);
    ctx.fillStyle='#ccc';
    ctx.textAlign='center';
    ctx.font='14px Segoe UI';
    ctx.fillText('No expense data yet',150,130);
  }
  // Transactions
  var sorted=[].concat(txs).sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  document.getElementById('txCount').textContent='('+txs.length+')';
  var list=document.getElementById('txList');
  if(sorted.length===0){
    list.innerHTML='<div class="empty-state"><div>💸</div>No transactions yet. Add your first one!</div>';
    return;
  }
  list.innerHTML=sorted.map(function(t){
    return '<div class="tx-item">'+
      '<div class="tx-left">'+
      '<div class="tx-icon '+(t.type==='income'?'inc':'exp')+'">'+(t.type==='income'?'💚':'❤️')+'</div>'+
      '<div class="tx-info"><div class="tx-cat">'+t.category+'</div>'+
      (t.note?'<div class="tx-note">'+t.note+'</div>':'')+
      '<div class="tx-date">'+t.date+'</div></div>'+
      '</div>'+
      '<div style="display:flex;align-items:center">'+
      '<div class="tx-amount '+(t.type==='income'?'inc':'exp')+'">'+(t.type==='income'?'+':'-')+fmt(t.amount)+'</div>'+
      '<button class="tx-del" onclick="deleteTx('+t.id+')">🗑</button>'+
      '</div></div>';
  }).join('');
}
function addTransaction(){
  var type=document.getElementById('txType').value;
  var cat=document.getElementById('txCat').value;
  var amount=parseFloat(document.getElementById('txAmount').value);
  var note=document.getElementById('txNote').value.trim();
  var date=document.getElementById('txDate').value;
  if(!amount||amount<=0){toast('Please enter a valid amount!');return;}
  if(!date){toast('Please select a date!');return;}
  var txs=userData.transactions||[];
  var id=Date.now();
  txs.push({id:id,type:type,category:cat,amount:amount,note:note,date:date});
  userData.transactions=txs;
  var users=getUsers();
  users[currentUser]=userData;
  saveUsers(users);
  document.getElementById('txAmount').value='';
  document.getElementById('txNote').value='';
  toast((type==='income'?'✅ Income':'✅ Expense')+' added!',true);
  render();
}
function deleteTx(id){
  userData.transactions=(userData.transactions||[]).filter(function(t){return t.id!==id;});
  var users=getUsers();
  users[currentUser]=userData;
  saveUsers(users);
  toast('Transaction deleted.',true);
  render();
}
function saveBudget(){
  var b=parseFloat(document.getElementById('budgetInput').value);
  if(!b||b<=0){toast('Please enter a valid budget amount!');return;}
  userData.budget=b;
  var users=getUsers();
  users[currentUser]=userData;
  saveUsers(users);
  toast('✅ Budget set to '+fmt(b),true);
  render();
}
init();
</script>
</body>
</html>
